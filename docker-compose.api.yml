services:
  redis:
    container_name: blackbird-redis
    command:
      - redis-server
      - "--appendonly"
      - "yes"
      - "--requirepass ${REDIS_PASSWORD}"
    image: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [api-network]
    ports:
      - "${REDIS_HOST_PORT:-6379}:${REDIS_PORT:-6379}"

  api:
    container_name: blackbird-api
    env_file:
      - .env
    build:
      context: .
      target: api
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - REDIS_HOST=${REDIS_HOST:-redis}
    depends_on:
      redis:
        condition: service_started
      pgsql:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
    networks: [api-network]
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - ${MEDIA_LOCATION:-./data/media/}incoming:/data/media/incoming
      - ${MEDIA_LOCATION:-./data/media/}downloadCache:/data/media/downloadCache
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /var/www/api/src
        - action: sync+restart
          path: ./emails
          target: /var/www/api/emails
        - action: rebuild
          path: ./prisma
          target: /var/www/api/prisma
        - action: rebuild
          path: package.json

  background:
    container_name: blackbird-background
    env_file:
      - .env
    build:
      context: .
      target: background
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      redis:
        condition: service_started
      pgsql:
        condition: service_started
      api:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [api-network]
    volumes:
      - ${MEDIA_LOCATION:-./data/media/}processing:/data/media/processing
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /var/www/api/src
        - action: sync+restart
          path: ./emails
          target: /var/www/api/emails
        - action: rebuild
          path: ./prisma
          target: /var/www/api/prisma
        - action: rebuild
          path: package.json

  garage:
    container_name: blackbird-garage
    image: dxflrs/garage:v2.1.0
    networks: [api-network]
    ports:
      - "9000:9000" # S3 API, the port LOCAL_S3_API_PORT expects
      - "3903:3903" # Admin API (cluster status, keys, buckets)
    volumes:
      - garage_storage:/var/lib/garage
      - ./scripts/garage/garage.toml:/etc/garage.toml:ro
    environment:
      RUST_LOG: ${GARAGE_LOG_LEVEL:-garage=warn}

  garage-init:
    container_name: blackbird-garage-init
    image: curlimages/curl:8.11.1
    networks: [api-network]
    depends_on:
      - garage
    env_file: .env
    environment:
      GARAGE_HOST: garage
      GARAGE_ADMIN_TOKEN: c3f80a1d5b6e294738af05c1d9e6b47250fa38c9e1d4b70a635f9c28e04d7b16
    volumes:
      - ./scripts/garage/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  pgsql:
    container_name: blackbird-pgsql
    image: postgres:14-alpine
    env_file:
      - .env
    volumes:
      - ./data/pgsql:/var/lib/postgresql/data
      - ./data/pgsql_backups:/backups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [api-network]
    ports:
      - "${POSTGRES_LOCAL_MACHINE_PORT:-5432}:5432"

  mailhog:
    container_name: blackbird-mailhog
    image: mailhog/mailhog:latest
    networks: [api-network]
    ports:
      - "1025:1025" # SMTP Port
      - "8025:8025" # Web UI Port
    restart: unless-stopped

networks:
  api-network:
    driver: bridge

volumes:
  garage_storage: {}

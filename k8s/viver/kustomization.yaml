namespace: viver
resources:
  - ../base
  - env-configmap.yaml
patches:
  - target:
      version: v1
      kind: Ingress
      name: mirlo
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: viver.lainstrumental.org
      - op: replace
        path: /spec/tls/0/hosts/0
        value: viver.lainstrumental.org
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: "app=mirlo"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: txels/mirlo:20261119-0912
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

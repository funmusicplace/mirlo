# Mirlo persistent storage: used for processing files
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    service: mirlo
  name: mirlo-download-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    service: mirlo
  name: mirlo-incoming
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    service: mirlo
  name: mirlo-processing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mirlo
    service: mirlo-api
  name: mirlo-background
spec:
  selector:
    matchLabels:
      service: mirlo-background
  template:
    metadata:
      labels:
        service: mirlo-background
    spec:
      containers:
        - name: mirlo-background
          image: txels/mirlo:latest
          imagePullPolicy: IfNotPresent
          command:
            [
              "node",
              "--conditions=mirlo-dist",
              "--enable-source-maps",
              "dist/jobs/queue-worker.js",
              "run",
            ]
          envFrom:
            - configMapRef:
                name: mirlo-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mirlo-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mirlo-secrets
                  key: JWT_SECRET
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: mirlo-secrets
                  key: REFRESH_TOKEN_SECRET
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mirlo-secrets
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mirlo-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: password
          resources:
            requests:
              cpu: 200m
              memory: 300Mi
            limits:
              cpu: 800m
              memory: 600Mi
          livenessProbe:
            exec:
              command:
                - "true"
          volumeMounts:
            - mountPath: /data/media/processing
              name: mirlo-processing
      restartPolicy: Always
      volumes:
        - name: mirlo-processing
          persistentVolumeClaim:
            claimName: mirlo-processing
      affinity: #FIXME: because of the volume mounts, API pods must be on the same node
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: service
                    operator: In
                    values:
                      - mirlo-background
              topologyKey: kubernetes.io/hostname

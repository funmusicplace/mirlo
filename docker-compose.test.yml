services:
  stripe-test:
    container_name: blackbird-stripe-mock-test
    image: stripe/stripe-mock:v0.199.0
    networks: !reset [test-network]
    ports: !reset []
    profiles: [test]

  redis-test:
    extends:
      file: docker-compose.api.yml
      service: redis
    container_name: blackbird-redis-test
    networks: !reset [test-network]
    ports: !reset []
    profiles: [test]

  api-test:
    extends:
      file: docker-compose.api.yml
      service: api
    container_name: blackbird-api-test
    networks: !reset [test-network]
    links:
      - redis-test:redis
      - garage-test:garage
      - pgsql-test:pgsql
    ports: !reset []
    depends_on: !override
      redis-test:
        condition: service_started
      pgsql-test:
        condition: service_started
      stripe-test:
        condition: service_started
      garage-init-test:
        condition: service_completed_successfully
    environment:
      NODE_ENV: test
      API_DOMAIN: http://api:3000
      STRIPE_HOST: stripe-test
      STRIPE_PORT: 12111
      STRIPE_PROTOCOL: http
      STRIPE_KEY: sk_test_123
      LOCAL_S3_PUBLIC_HOST: ""
    profiles: [test]

  garage-test:
    extends:
      file: docker-compose.api.yml
      service: garage
    container_name: blackbird-garage-test
    networks: !reset [test-network]
    ports: !reset []
    volumes: !override
      - garage_storage-test:/var/lib/garage
      - ./scripts/garage/garage.toml:/etc/garage.toml:ro
    profiles: [test]

  garage-init-test:
    extends:
      file: docker-compose.api.yml
      service: garage-init
    container_name: blackbird-garage-init-test
    networks: !reset [test-network]
    links:
      - garage-test:garage
    depends_on: !override
      - garage-test
    environment:
      GARAGE_HOST: garage
    profiles: [test]

  pgsql-test:
    extends:
      file: docker-compose.api.yml
      service: pgsql
    container_name: blackbird-pgsql-test
    networks: !reset [test-network]
    ports: !reset []
    volumes: !reset
      - ./data/pgsql-test:/var/lib/postgresql/data
      - ./data/pgsql_backups-test:/backups
    profiles: [test]

  test:
    extends:
      file: docker-compose.api.yml
      service: api
    container_name: blackbird-test
    networks: !reset [test-network]
    links:
      - redis-test:redis
      - api-test:api
      - garage-test:garage
      - pgsql-test:pgsql
      - stripe-test:stripe
    ports: !reset []
    depends_on: !reset
      api-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      CI: "${CI:-false}"
      API_DOMAIN: http://api:3000
      LOCAL_S3_PUBLIC_HOST: ""
    command: yarn api:test
    restart: no
    profiles: [test]
    develop:
      watch:
        - action: sync+restart
          path: ./test
          target: /var/www/api/test

networks:
  test-network:
    driver: bridge

volumes:
  garage_storage-test: {}

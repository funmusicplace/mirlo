services:
  # A node web service
  - type: web
    name: api
    env: node
    repo: https://github.com/funmusicplace/mirlo.git # optional
    region: oregon # optional (defaults to oregon)
    branch: main # optional (defaults to master)
    plan: standard # Supposedly this should be free but

    buildCommand: corepack enable && yarn install --immutable && yarn prisma:build && yarn prisma:migrate:deploy && NODE_OPTIONS=--max-old-space-size=3072 yarn client:build && yarn api:build
    startCommand: node --conditions=mirlo-dist --enable-source-maps dist/index.js
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: true
      - key: NODE_ENV
        value: production
      # Baked into the client at build time; the website ID comes from the
      # Umami dashboard after adding mirlo.space as a website there.
      - key: VITE_UMAMI_WEBSITE_ID
        sync: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=1512
      - key: DATABASE_URL
        fromDatabase:
          name: blackbrd
          property: connectionString
      - fromGroup: blackbrd
      - key: REDIS_HOST
        fromService:
          type: redis
          name: redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis
          property: port

  # Umami analytics (https://umami.is)
  # Runs against a separate database inside the existing blackbrd Postgres
  # instance, as its own `umami` role, so a compromised Umami can't read
  # Mirlo's data. Umami is itself a Prisma app, so it must NOT share Mirlo's
  # database — both would write to the same _prisma_migrations table.
  # One-time setup, as blackbrd (temporarily add your IP to the database's
  # ipAllowList):
  #   CREATE ROLE umami LOGIN PASSWORD '<random>';
  #   GRANT umami TO blackbrd;
  #   CREATE DATABASE umami_app OWNER umami;
  #   REVOKE CONNECT ON DATABASE umami_app FROM PUBLIC;
  #   REVOKE CONNECT ON DATABASE <mirlo database> FROM PUBLIC;
  # Then set DATABASE_URL to postgres://umami:<random>@<internal host>/umami_app.
  # Default login is admin / umami — change it immediately after first deploy.
  - type: web
    name: umami
    env: docker
    dockerfilePath: ./umami/Dockerfile
    plan: starter
    region: oregon
    autoDeploy: false
    healthCheckPath: /api/heartbeat
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_TYPE
        value: postgresql
      - key: APP_SECRET
        generateValue: true
      - key: DISABLE_TELEMETRY
        value: 1

  # A worker
  - type: worker
    name: background
    env: docker
    plan: standard # optional (defaults to starter)
    dockerfilePath: ./Dockerfile # optional
    dockerCommand: node --conditions=mirlo-dist --enable-source-maps dist/jobs/queue-worker.js run
    disk: # this disk gets used to process audio. They should get moved to the
      # object storage and deleted after upload
      name: data
      mountPath: /data
      sizeGB: 40 # optional
    # dockerContext: ./background/src # optional
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blackbrd
          property: connectionString
      - fromGroup: blackbrd
      - key: REDIS_HOST
        fromService:
          type: redis
          name: redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis
          property: port

  # A Redis instance
  - type: redis
    name: redis
    ipAllowList: [] # internal connections only
    plan: standard # optional (defaults to starter)
    maxmemoryPolicy: noeviction # optional (defaults to allkeys-lru)

databases:
  - name: blackbrd
    plan: standard
    # databaseName: postgres # optional (Render may add a suffix)
    user: blackbrd # optional
    ipAllowList: [] # internal connections only; add your IP temporarily for psql


